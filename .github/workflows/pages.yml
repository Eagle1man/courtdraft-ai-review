name: Publish site

# Публикация сайта на GitHub Pages.
#
# Что публикуется: только каталог site/. В него входит статическое
# демо, собранное из прогона демо-стенда на СИНТЕТИЧЕСКОМ деле.
#
# Почему публикуется только site/, а не корень: в корне лежат
# материалы демо, база данных и код. Материалы дел не должны покидать
# машину, а .gitignore не является границей публикации — им является
# список файлов, который отдаётся наружу. Здесь он явный.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check_site.py'
      - 'scripts/build_demo_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# По умолчанию токен выдаётся только на чтение. Публикация страниц
# делает это настройка репозитория (Settings → Pages → Source),
# и для неё нужен именно scopes: pages: write.
permissions:
  contents: read
  pages: write
  id-token: write

# Две публикации подряд перезаписывают друг друга, и страница
# отдаётся с прошлой версией — это выглядит как «сайт не обновился».
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Вёрстка проверяется до публикации, а не после: опубликованная
      # страница со сломанными ссылками видна заказчику.
      - name: Check site markup
        run: python scripts/check_site.py

      - name: Check demo data is synthetic
        run: python scripts/build_demo_site.py --check-only

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
