# ── Python ────────────────────────────────────────────────────────────────
# Локально разрабатывается на 3.14 (единственный рабочий на ноутбуке),
# но код рассчитан на >=3.12, чтобы переноситься на машину с RTX 3050.
requires-python = ">=3.12"

[project]
name = "courtdraft-backend"
version = "0.1.0"
description = "Локальная подготовка проекта судебного акта с обязательной проверкой человеком"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # db
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    # asyncpg — для PostgreSQL (runtime, RTX 3050)
    "asyncpg>=0.30",
    # aiosqlite — для MOCK-режима на машине без PostgreSQL.
    # На DEV-машине PostgreSQL не установлен, а Docker недоступен,
    # поэтому разработка и тесты идут на SQLite. Код при этом один.
    "aiosqlite>=0.20",
    # vector
    "qdrant-client>=1.12",
    # orchestration
    "langgraph>=0.2",
    # http
    "httpx>=0.27",
    # документы
    "pypdf>=5.1",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    # прочее
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── Ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "C4",          # comprehensions
    "SIM",         # simplify
    "ASYNC",       # async
    "S",           # bandit — важно для юридических данных
]
ignore = [
    "S101",  # assert — используется в тестах и внутренних инвариантах
    "B008",  # Depends() в аргументах — стандартный паттерн FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"alembic/versions/**" = ["E501"]

# ── mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["alembic/", ".venv/"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "integration: требует PostgreSQL/Qdrant",
    "e2e: полный проход pipeline",
    "mock: работает только в MOCK-режиме",
]
